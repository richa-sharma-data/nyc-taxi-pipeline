version: 2

models:
  - name: stg_yellow_taxi
    columns:
      - name: vendor_id
        tests:
          - not_null
      - name: pickup_at
        tests:
          - not_null
      - name: total_amount
        tests:
          - not_null
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
